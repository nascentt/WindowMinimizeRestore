[Settings]
; 0 = classic Windows 10 three-stage behavior (minimized, restored, maximized)
; 1 = skip the restored stage and jump between minimized and maximized
SkipRestore=0
; 0 = disable Ctrl+Alt+Left/Right monitor snapping
; 1 = enable Ctrl+Alt+Left/Right monitor snapping
EnableHorizontalSnap=1
; 0 = disable Ctrl+Alt+Up/Down vertical snapping
; 1 = enable Ctrl+Alt+Up/Down vertical snapping
EnableVerticalSnap=1
; restore = original size/relative position; maximize = maximize between screen halves
SnapIntermediateState=restore
; 0 = disable snap-geometry diagnostics
; 1 = log requested/actual bounds immediately and at 100/300/600/1200ms after snap/restore
DebugSnapGeometry=0

[Hotkeys]
HorizontalLeft=^!Left
HorizontalRight=^!Right
VerticalUp=^!Up
VerticalDown=^!Down
MinimizeRestore=^+Down
RestoreMaximize=^+Up
Settings=^!s
